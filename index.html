<script>

/* 主站（有 Functions 后端）与只读镜像（GitHub Pages，无后端）共用同一份前端：
   镜像上票数/纠错走 community.json 静态快照展示真实数据，写入动作引导回主站，不假装投票成功。 */

const IS_MIRROR = !/(^|\.)qoder\.zone$/i.test(location.hostname);
const mainLink = () => MAIN_SITE + "/" + (location.hash || "#home");
const byId = id => D.agents.find(a=>a.id===id);
const TABS = [["home","首页"],["rank","榜单"],["arena","基准榜"],["pick","帮我选"],["compare","对比"],["price","价格情报"],["relay","中转站"],["profiles","档案"],["timeline","大事记"],["qa","问答"]];

let curDim = D.benchmarks ? "elo" : "coding"; // 默认顺序 = 基准榜页默认的 Arena Elo 顺序
let pQuery = "";
let cmpSel = new Set(D.popularComparisons[0]);

document.getElementById("slogan").textContent = D.meta.slogan;
document.getElementById("foot").innerHTML =
  `数据核实截至 <b style="color:var(--gold)">${D.meta.dataUpdatedAt}</b> · ${D.meta.disclaimer}<br>${D.meta.exchangeRate}<br><a href="/about.html">榜单方法论 · 数据口径 · 广告与联盟披露政策</a> · <a href="/weekly.html">每周简报归档</a>`;

function renderNav(){
  document.getElementById("nav").innerHTML = TABS.map(([k,n])=>
    `<button class="${k===cur?'on':''}" onclick="go('${k}')">${n}</button>`).join("");
}
function go(k){ cur=k; if(SEO[k]) setSEO(...SEO[k]); location.hash=k; render(); }

/* ---------- 首页 ---------- */
function viewHome(){
  const evs = EVENTS.slice(0,3);
  const top = d => [...D.agents].map(a=>({a,s:D.scores[a.id][d]})).sort((x,y)=>y.s-x.s).slice(0,3);
  return `
  ${stampHTML()}
  ${D.benchmarks ? `<h2>🏆 ${D.benchmarks.sourceName} · 产品排行（本站榜单默认排序依据）</h2>
  <div class="card"><table style="margin:0">${D.benchmarks.models.slice(0,5).map((m,i)=>{const a=byId(m.agent);return `<tr><td class="rank ${i<3?'top':''}">${i<3?MEDAL[i]:i+1}</td>
  <td><a onclick="go('rank')" style="cursor:pointer;color:var(--text)"><b>${a?a.name:m.agent}</b></a> <span class="ev-sum">${m.model} · Coding Elo ${m.coding}</span></td>
  <td class="score-num" style="text-align:right">${m.elo}</td></tr>`;}).join("")}</table>
  <div class="ev-sum" style="margin-top:8px">本表行序 = Arena+ 页面默认顺序，完整 ${D.benchmarks.models.length} 席与七维评分在榜单页 · <a href="${D.benchmarks.source}" target="_blank" rel="noopener">打开源榜 ↗</a> · <a onclick="go('rank')" style="cursor:pointer">查看完整榜单 →</a> · <a onclick="go('arena')" style="cursor:pointer">全量 ${D.arena?D.arena.rows.length:0} 模型快照 →</a></div></div>` : ''}
  <h2>按场景选</h2>
  <div class="grid g3">${[
    ["💻","写代码 / 编程","编码榜：模型 Coding Elo 换算",  "coding"],
    ["🤖","自主执行任务","Agent 能力：长任务完成度",       "agent"],
    ["📋","办公 / 文档处理","写作、表格、PPT 辅助",         "office"],
    ["🎨","生图 / 音视频","多模态创作能力",                 "multimodal"],
    ["💰","预算有限看性价比","$20/¥50 档谁最值",            "value"],
    ["","不想折腾网络","国内直连可达性榜",                "access"]
  ].map(([ic,t,d,k])=>`<div class="card scene" onclick="curDim='${k}';sortDesc=true;go('rank')">
    <b>${ic} ${t}</b><div class="ev-sum" style="margin-top:4px">${d} →</div></div>`).join("")}</div>
  <div class="note" style="margin-top:2px">拿不准？<a onclick="go('pick')" style="cursor:pointer">回答 3 个问题，帮你选 →</a></div>
  <h2>社区人气榜</h2>${popBoardHTML()}
  ${D.weekly && D.weekly.length ? `<h2>本周情报简报 · ${D.weekly[0].date}</h2>
  <div class="card"><ul class="clean">${D.weekly[0].items.map(i=>`<li>${i}</li>`).join("")}</ul>
  <div class="ev-sum" style="margin-top:8px">每周五自动核实更新 · <a onclick="go('timeline')" style="cursor:pointer">查看历史简报 →</a></div></div>` : ''}
  <h2>今日情报 · 最新事件</h2>
  <div class="grid g3">${evs.map(evCard).join("")}</div>
  <h2>三大榜首速览</h2>
  <div class="grid g3">
    ${rankSnapshot("编码最强","coding",top("coding"))}
    ${rankSnapshot("自主执行最强","agent",top("agent"))}
    ${rankSnapshot("性价比最高","value",top("value"))}
  </div>
  <h2>大家在比什么</h2>
  <div class="hotcmp">${D.popularComparisons.map(p=>
    `<button onclick="quickCmp('${p[0]}','${p[1]}')">${byId(p[0]).name} vs ${byId(p[1]).name}</button>`).join("")}</div>
  <h2>价格快照（入门付费档）</h2>
  <div class="grid g3">${D.agents.map(a=>`
    <div class="card" style="display:flex;justify-content:space-between;align-items:center">
      <div><b>${a.name}</b><div class="ev-sum">${a.billing||D.billing[a.id]}</div></div>
      <div class="price" style="text-align:right">${a.plans[1]?.price||"免费"}</div>
    </div>`).join("")}</div>
  <button class="btn" style="margin-top:10px" onclick="go('price')">完整价格情报 →</button>
  <button class="btn ghost" style="margin-top:10px" onclick="go('relay')">API 中转站情报 · 报价对照 →</button>
  <div class="note">${D.scoreMethod}</div>`;
}
function evCard(e){
  return `<div class="card"><div class="ev-date">${e.date}<span class="ev-tag">${e.tag}</span></div>
  <div class="ev-title">${e.title}</div><div class="ev-sum">${e.summary}</div>
  <div class="ev-sum" style="margin-top:6px">${e.agents.map(id=>`<span class="pill">${byId(id).name}</span>`).join("")}
  <a href="${e.source}" target="_blank" style="font-size:12px">来源 ↗</a></div></div>`;
}
function rankSnapshot(title,dim,list){
  return `<div class="card"><b style="color:var(--gold)">${title}</b>
  <table style="margin-top:8px">${list.map((x,i)=>`<tr><td class="rank ${i===0?'top':''}">${i+1}</td>
  <td><a onclick="openAgent('${x.a.id}')" style="cursor:pointer">${x.a.name}</a></td>
  <td class="score-num" style="text-align:right">${x.s.toFixed(1)}</td></tr>`).join("")}</table>
  <button class="btn ghost" style="margin-top:8px;width:100%" onclick="go('rank')">查看完整榜单</button></div>`;
}

/* ---------- 帮我选（三问 quiz） ---------- */
const USE = {coding:["💻 写代码/编程", "coding"], agent:["🤖 自主执行任务（Agent）", "agent"], office:["📋 办公问答/文档处理", "office"], multimodal:["🎨 生图/视频/语音", "multimodal"], research:["🔍 搜索研究/查资料溯源", "context"]};
const BUD = {free:["不想花钱，免费档就行", 0], low:["每月 ≤ ¥50", 50], mid:["每月 ≤ ¥150（$20 档）", 150], any:["预算不限，好用就行", Infinity]};
const ACC = {cn:["必须国内直连、人民币支付", 1], any:["网络环境/海外支付都能搞定", 0]};
let pzStep = 0, pzAns = {use:"coding", budget:"mid", access:"any"};
const priceCNY = s => {
  const usd = /\$|usd/i.test(s), cny = /¥|元|cny|rmb/i.test(s);
  if (!usd && !cny) return Infinity; // 纯文字价（"低价档/见 App"）无法量化
  const m = s.match(/(\d+(?:[.,]\d+)?)/); if (!m) return Infinity;
  const v = parseFloat(m[1].replace(",", "."));
  return usd ? v * 7.1 : v;
};
const minPaid = a => Math.min(...a.plans.filter(p => !/免费|\$0\b|¥0\b|^0/.test(p.price)).map(p => priceCNY(p.price)), Infinity);
const hasFree = a => a.plans.some(p => /免费|\$0\b|¥0\b|零/.test(p.price));
function pickSet(k, v){ pzAns[k] = v; }
function pickNext(){ pzStep++; render(); }
function pickBack(){ pzStep = Math.max(0, pzStep - 1); render(); }
function pickRestart(){ pzStep = 0; render(); }
function recommend(){
  const dim = USE[pzAns.use][1], cap = BUD[pzAns.budget][1];
  let pool = D.agents.filter(a => {
    if (pzAns.access === "cn" && !a.region.startsWith("国内")) return false;
    if (pzAns.budget === "free") return hasFree(a);
    return minPaid(a) <= cap;
  });
  if (!pool.length) pool = D.agents.filter(a => pzAns.access !== "cn" || a.region.startsWith("国内"));
  const scored = pool.map(a => {
    const s = D.scores[a.id];
    return {a, r: 0.65*s[dim] + 0.2*s.value + 0.15*s.access};
  }).sort((x, y) => y.r - x.r);
  return scored.slice(0, 3);
}
function viewPick(){
  const Q = [["use","第一问 · 你主要拿它干什么？",USE],["budget","第二问 · 每月预算多少？",BUD],["access","第三问 · 国内使用条件？",ACC]];
  if (pzStep < 3){
    const [k, title, opts] = Q[pzStep];
    return `<h2>帮我选 · 三问定推荐</h2>
    <div class="card"><b style="color:var(--gold)">${title}</b>
    <div style="display:grid;gap:8px;margin-top:12px">${Object.entries(opts).map(([v,[label]])=>
      `<button class="btn ${pzAns[k]===v?'':'ghost'}" style="${pzAns[k]===v?'border-color:var(--gold)':''};text-align:left" onclick="pickSet('${k}','${v}')">${label}</button>`).join("")}</div>
    <div style="margin-top:14px;display:flex;gap:8px">${pzStep?`<button class="btn ghost" onclick="pickBack()">← 上一问</button>`:""}<button class="btn" onclick="pickNext()">${pzStep===2?"看推荐 →":"下一问 →"}</button></div>
    <div class="ev-sum" style="margin-top:10px">${"●".repeat(pzStep+1)}${"○".repeat(2-pzStep)} 推荐基于编辑部 7 维评分 + 已核实价格，不掺杂任何推广。</div></div>`;
  }
  const res = recommend();
  return `<h2>你的推荐 · ${USE[pzAns.use][0]} / ${BUD[pzAns.budget][0]} / ${ACC[pzAns.access][0]}</h2>
  ${res.map((x,i)=>`<div class="card" style="margin-bottom:10px">
    <b style="font-size:16px">${i===0?"🏆 ":" "}${x.a.name}</b><span class="region ${x.a.region.startsWith('国内')?'国内':'海外'}">${x.a.region}</span>
    <div class="ev-sum">${x.a.vendor} · ${x.a.tagline}</div>

/* ---------- 社区人气投票 ---------- */
const VKEY = "agent-intel-voter";
const VLOCAL = "agent-intel-votes-local";
let VOTES = { counts:{}, mine:[], offline:false, loaded:false, pending:{}, readonly:false, snapshotAt:"" };
let CORR = []; /* 社区纠错：主站实时读取，镜像读 community.json 快照 */
function voterId(){
  let v = localStorage.getItem(VKEY);
  if(!v || !/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(v)){
    v = (crypto.randomUUID ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx"
      .replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c==="x"?r:(r&3|8)).toString(16); }));
    localStorage.setItem(VKEY, v);
  }
  return v;
}
function localMine(){ try{ const s=JSON.parse(localStorage.getItem(VLOCAL)||"[]"); return Array.isArray(s)?s:[]; }catch{ return []; } }
function applyTally(j){ VOTES.counts=j.counts||{}; if(Array.isArray(j.mine)) VOTES.mine=j.mine; VOTES.offline=false; VOTES.loaded=true; }
function applyLocalMine(){ VOTES.mine=localMine(); VOTES.counts={}; VOTES.mine.forEach(k=>{ VOTES.counts[k]=(VOTES.counts[k]||0)+1; }); VOTES.offline=true; VOTES.loaded=true; }
async function loadVotes(){
  if(IS_MIRROR){
    /* 镜像站没有 Functions 后端：票数/纠错读 community.json 静态快照（主站真实数据，只读） */
    try{
      const r = await fetch(`community.json?v=${D.meta.dataUpdatedAt}`, {cache:"no-store"});
      if(!r.ok) throw 0;
      const j = await r.json();
      if(!j || typeof j.counts !== "object") throw 0;
      VOTES.counts = j.counts; VOTES.mine = localMine(); VOTES.loaded = true;
      VOTES.readonly = true; VOTES.snapshotAt = j.fetchedAt || "";
      CORR = Array.isArray(j.corrections) ? j.corrections : [];
    }catch{ VOTES.readonly = true; applyLocalMine(); }
    if(cur==="rank"||cur==="qa") render(); return;
  }
  try{
    const r = await fetch(`/functions/v1/app?action=tally&voter=${voterId()}`, {credentials:"same-origin"});
    if(!r.ok) throw 0;
    const j = await r.json();
    if(!j || j.ok!==true || typeof j.counts!=="object") throw 0;
    applyTally(j);
  }catch{ applyLocalMine(); }
  try{
    const rc = await fetch("/functions/v1/app?action=corrections", {credentials:"same-origin"});
    const jc = await rc.json();
    if(rc.ok && jc.ok && Array.isArray(jc.items)) CORR = jc.items.map(i=>({agent:i.agent_id, note:(i.note||"").trim(), at:(i.created_at||"").slice(0,10)}));
  }catch{ /* 纠错读不到不影响主流程 */ }
  if(cur==="rank"||cur==="qa") render();
}
function voteCell(id, dim){
  const key = id+"|"+dim;
  const n = VOTES.counts[key]||0;
  const did = VOTES.mine.includes(key) || VOTES.offline && localMine().includes(key);
  if(VOTES.readonly) return `<a class="votebtn" href="${MAIN_SITE}/#rank" target="_blank" rel="noopener" title="本页是只读镜像，票数为 ${VOTES.snapshotAt||"最新"} 主站真实统计；想投票请到主站">👍 ${n} ↗</a>`;
  const dis = VOTES.pending[key] ? " disabled" : "";
  return `<button class="votebtn${did?' did':''}"${dis} onclick="castVote('${id}','${dim}')" title="为${D.dimensions[dim]||'综合'}维度投票">👍 ${n}</button>`;
}
async function castVote(id, dim){
  dim = dim || "overall";
  const key = id+"|"+dim;
  if(VOTES.pending[key]) return;
  if(VOTES.readonly){ window.open(MAIN_SITE+"/#rank","_blank","noopener"); return; }
  VOTES.pending[key] = true; render();
  if(VOTES.offline){
    const m = localMine();
    if(!m.includes(key)){ m.push(key); localStorage.setItem(VLOCAL, JSON.stringify(m)); }
    applyLocalMine(); delete VOTES.pending[key]; render(); return;
  }
  try{
    const r = await fetch("/functions/v1/app?action=vote", {
      method:"POST", credentials:"same-origin",
      headers:{"content-type":"application/json"},
      body: JSON.stringify({agent:id, dim, voter:voterId()}),
    });
    const j = await r.json();
    if(!j || j.ok!==true || typeof j.counts!=="object") throw 0;
    applyTally(j);
  }catch{
    // 结果未知：不重放写入，只刷新统计对账
    VOTES.offline = true;
    await loadVotes();
  }
  delete VOTES.pending[key]; render();
}
window.castVote = castVote;

  const note = document.getElementById("reportNote").value.trim();
  const msg = document.getElementById("reportMsg");
  if (note.length < 2) { msg.textContent = "请至少写几个字"; return; }
  if (VOTES.readonly) {
    /* 镜像不能写库：不假装"已提交"，把内容带到主站纠错入口 */
    msg.innerHTML = `本镜像为只读，提交需要到主站 → <a href="${MAIN_SITE}/#agent-${id}" target="_blank" rel="noopener" style="color:var(--gold)">在主站提交这条纠错</a>`;
    window.open(MAIN_SITE + "/#agent-" + id, "_blank", "noopener");
    return;
  }
  const saveLocal = () => {
    const key = "agent-intel-reports";
    const m = JSON.parse(localStorage.getItem(key) || "[]");
    if (!m.includes(id)) m.push(id);
    localStorage.setItem(key, JSON.stringify(m));
    document.getElementById("reportedTag").style.display = "inline";
  };
  try {
    const r = await fetch("/functions/v1/app?action=report", {
      method: "POST", credentials: "same-origin",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ agent: id, voter: voterId(), note }),
    });
    const j = await r.json();
    if (!r.ok || !j.ok) throw 0;
    saveLocal(); msg.textContent = "✅ 已提交，谢谢你";
  } catch {
    saveLocal(); msg.textContent = "已记录在本地（离线模式），编辑周报时可见";
  }
}
function priceHistHTML(id){
  const evs = EVENTS.filter(e => e.agents && e.agents.includes(id) && /定价|额度|政策/.test(e.tag));
  const ph = (D.priceHistory || {})[id];
  let spark = "";
  if (Array.isArray(ph) && ph.length >= 2 && ph.every(p => typeof p.v === "number")) {
    const unit = ph[0].unit || "";
    const vs = ph.map(p => p.v), min = Math.min(...vs), max = Math.max(...vs), span = max - min || 1;
    const pts = vs.map((v, i) => `${(i / (vs.length - 1)) * 150 + 4},${32 - ((v - min) / span) * 26}`).join(" ");
    spark = `<svg width="158" height="38" style="vertical-align:middle"><polyline points="${pts}" fill="none" stroke="var(--gold)" stroke-width="2"/>
      <circle cx="${pts.split(" ").pop().split(",")[0]}" cy="${pts.split(" ").pop().split(",")[1]}" r="2.5" fill="var(--gold)"/></svg>
      <span class="ev-sum"> ${vs[0]}→${vs[vs.length-1]}${unit}（${ph[0].date} 至今 ${ph.length} 个点位）</span><br>`;
  }
  if (!evs.length && !spark) return `<div class="ev-sum">暂无定价/额度类事件记录</div>`;
  return spark + evs.map(e =>
    `<div style="margin:4px 0"><span class="ev-sum" style="white-space:nowrap">${e.date}</span> <span class="ev-tag">${e.tag}</span> ${e.title}
     <a href="${e.source}" target="_blank" style="font-size:12px">来源↗</a></div>`).join("") +
    `<div class="ev-sum" style="margin-top:4px;font-size:11px">自动聚合自大事记（定价/额度/政策类），每周核实时补充价格点位数据。</div>`;
}

function route(){
  const h = location.hash.slice(1);
  if(h.startsWith("agent-")){
    const a = byId(h.slice(6));
    if(a){ cur="profiles"; setSEO(`${a.name} 价格·评测·档案`, `${a.tagline}。入门 ${a.plans[1]?.price||"免费"}，含订阅档位、国内使用门槛与来源核实。`); render(); openAgent(a.id); return; }
  }
  if(h.startsWith("cmp-")){
    const ids = h.slice(4).split("-").filter(byId);
    if(ids.length>=2){ cur="compare"; cmpSel=new Set(ids.slice(0,3));
      const ns = [...cmpSel].map(id=>byId(id).name);
      setSEO(ns.join(" vs ") + " 对比", `${ns.join(" 与 ")}的价格、额度、能力与国内使用门槛横向对比。`); render(); return; }
  }
  cur = TABS.some(t=>t[0]===h) ? h : "home";
  setSEO(...SEO[cur]);
  render();
}
